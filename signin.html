<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Sign In</title>
</head>
<body class="chaos-mode">
    <div class="subs-counter-container" style="margin-top: 100px;">
        <h2>🔐 دخول المبرمجين</h2>
        <form id="authForm">
            <input type="text" id="username" placeholder="اسمك" required style="margin:10px; padding:10px;">
            <input type="email" id="email" placeholder="الإيميل" required style="margin:10px; padding:10px;">
            <input type="password" id="password" placeholder="كلمة السر" required style="margin:10px; padding:10px;">
            <button type="submit" class="buutoon">دخول</button>
        </form>
    </div>
    <script src="main.js"></script>
</body>
</html>
